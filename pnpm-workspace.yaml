# Use the shared store; auto links files on this filesystem instead of copying.
packageImportMethod: auto

# Reuse package metadata and cached native builds between installs.
preferOffline: true
sideEffectsCache: true

# Optional macOS watcher from the imported npm lockfile.
allowBuilds:
  fsevents@2.3.3: true

# Security fixes for transitive packages (pnpm audit / GitHub advisories):
# @tailwindcss/typography still asks for an old postcss-selector-parser.
# Drop it once typography moves on.
overrides:
  postcss-selector-parser@<6.1.5: ^6.1.6
minimumReleaseAgeExclude:
  - '@oxlint-tsgolint/darwin-arm64@7.0.2008'
  - '@oxlint-tsgolint/darwin-x64@7.0.2008'
  - '@oxlint-tsgolint/linux-arm64@7.0.2008'
  - '@oxlint-tsgolint/linux-x64@7.0.2008'
  - '@oxlint-tsgolint/win32-arm64@7.0.2008'
  - '@oxlint-tsgolint/win32-x64@7.0.2008'
  - oxlint-tsgolint@7.0.2008
