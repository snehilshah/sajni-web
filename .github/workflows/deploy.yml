name: Deploy (Vercel production)

# Tag-triggered explicit production promotion. Use:
#   git tag srf/release/v0.1.0
#   git push origin srf/release/v0.1.0
# 'srf' = sajni-react-frontend.
#
# Tags are the only way to production: vercel.json disables git
# deployments for main, so main pushes deploy nothing. Other branches
# still get Vercel previews via the git integration.
on:
  push:
    tags:
      - 'srf/release/v*'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing secret VERCEL_TOKEN;"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing variable VERCEL_ORG_ID;"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing variable VERCEL_PROJECT_ID;"
          if [ -n "$missing" ]; then
            echo "::error::Missing in repo Settings → Secrets and variables → Actions:$missing see DEPLOY.md"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Re-run the same gates CI runs so a tag can never ship a build
      # that wouldn't pass CI on the same commit.
      - run: pnpm run lint:ci
      - run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - run: pnpm run test:chunk-reload

      - name: Install Vercel CLI
        run: pnpm add --global --allow-build=esbuild vercel@latest

      # `vercel pull` writes .vercel/project.json + downloads env vars
      # for the prod environment. Needs VERCEL_ORG_ID / PROJECT_ID set
      # as repo Variables and VERCEL_TOKEN as a repo Secret.
      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $URL"
