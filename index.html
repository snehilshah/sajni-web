<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="theme-color" content="#f6fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101415" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Sajni is one quiet, personal codex for your notes, journal, tasks, habits, projects, media, and money." />
    <title>Sajni</title>
    <style>
      @keyframes sajni-startup-turn { to { transform: rotate(360deg); } }
      .startup-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: hsl(var(--background, 192 38% 97%));
        color: hsl(var(--primary, 188 100% 24%));
        --startup-mark-detail: hsl(var(--on-primary, 0 0% 100%));
      }
      [data-mode="dark"] .startup-loader {
        background: hsl(var(--background, 192 14% 7%));
        color: hsl(var(--primary, 192 66% 71%));
        --startup-mark-detail: hsl(var(--on-primary, 189 100% 13%));
      }
      .startup-loader__mark {
        display: block;
        width: 60px;
        height: 60px;
        transform-origin: 50% 50%;
        animation: sajni-startup-turn 1100ms linear infinite;
        animation-delay: var(--sajni-boot-delay, 0ms);
        will-change: transform;
      }
      .startup-loader--leaving {
        opacity: 0;
        pointer-events: none;
        transition: opacity 140ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-loader__mark { animation: none; }
      }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          // Keep the pre-React and React startup marks on one continuous
          // animation timeline, even when the DOM node changes.
          root.style.setProperty('--sajni-boot-delay', (-performance.now()) + 'ms');
          // 'sajni:theme' = preset id, or 'custom' when an AI theme is active
          // (its compiled CSS is cached so we can paint it before the app
          // fetches the active theme — no preset flash).
          var theme = localStorage.getItem('sajni:theme') || 'marine';
          var preset = localStorage.getItem('sajni:preset') || (theme === 'custom' ? 'marine' : theme);
          var presetCss = localStorage.getItem('sajni:preset-theme-css');
          if (presetCss) {
            var presetStyle = document.createElement('style');
            presetStyle.id = 'sajni-theme-presets';
            presetStyle.textContent = presetCss;
            document.head.appendChild(presetStyle);
          }
          if (theme === 'custom') {
            var css = localStorage.getItem('sajni:custom-theme-css');
            if (css) {
              var style = document.createElement('style');
              style.id = 'sajni-custom-theme';
              style.textContent = css;
              document.head.appendChild(style);
            } else {
              theme = preset;
            }
          }
          var modePref = localStorage.getItem('sajni:mode') || 'system';
          var density = localStorage.getItem('sajni:density') || 'comfortable';
          var effectiveMode = modePref;
          if (modePref === 'system') {
            effectiveMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.dataset.theme = theme;
          root.dataset.mode = effectiveMode;
          root.dataset.density = density;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="sajni-boot" class="startup-loader" role="status" aria-label="Opening Sajni">
      <svg class="startup-loader__mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 6C14 18 9 40 22 53C29 60 40 57 47 48C58 33 51 15 32 6Z" fill="currentColor" />
        <path d="M34 17C25 29 25 43 34 50" fill="none" stroke="var(--startup-mark-detail)" stroke-width="3" stroke-linecap="round" />
        <circle cx="20" cy="31" r="2.5" fill="var(--startup-mark-detail)" />
        <circle cx="44" cy="36" r="2.5" fill="var(--startup-mark-detail)" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
